---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ragflow.fullname" . }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  replicas: {{ .Values.ragflow.deployment.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "ragflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ragflow
  {{- with .Values.ragflow.deployment.strategy }}
  strategy:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "ragflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: ragflow
      annotations:
        checksum/values: {{ .Values | toYaml | sha256sum }}
        checksum/config-env: {{ include (print $.Template.BasePath "/env.yaml") . | sha256sum }}
        checksum/config-ragflow: {{ include (print $.Template.BasePath "/ragflow_config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.ragflow.deployment.nodeSelector }}
      nodeSelector:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.ragflow.deployment.affinity }}
      affinity:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- if or .Values.global.imagePullSecrets .Values.ragflow.image.pullSecrets }}
      imagePullSecrets:
        {{- with .Values.global.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.ragflow.image.pullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      # Thoi gian cho pod tu thoat khi bi xoa/rolling update.
      # Mac dinh k8s la 30s. Pod nay chay task_executor dang xu ly file ingest
      # => cat giua chung co the de lai task do dang. Nang len cho no ket thuc tu te.
      terminationGracePeriodSeconds: {{ .Values.ragflow.deployment.terminationGracePeriodSeconds | default 60 }}
      {{- if .Values.ragflow.codePatch.enabled }}
      initContainers:
        - name: ragflow-code-patch
          image: {{ include "ragflow.imageRepo" (dict "root" . "repo" .Values.ragflow.image.repository) }}:{{ .Values.ragflow.image.tag }}
          {{- with .Values.ragflow.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- range .Values.ragflow.codePatch.patches }}
              mkdir -p "/patched/$(dirname {{ .file }})"
              {{- if .fullFile }}
              # Ban day du: lay tu ConfigMap thay vi sed. Doi chieu md5 cua file
              # goc trong image de bao dam ban thay the dung nen tang moi ap.
              actual=$(md5sum "/ragflow/{{ .file }}" | cut -d' ' -f1)
              if [ "$actual" != "{{ .baseMd5 }}" ]; then
                echo "PATCH FAILED: {{ .file }} md5 khong khop"
                echo "  image  : $actual"
                echo "  expect : {{ .baseMd5 }}"
                echo "  => image da doi, ban patch co the khong con dung. Xem lai truoc khi bo qua."
                exit 1
              fi
              cp "/code-patch-src/{{ .fullFile }}" "/patched/{{ .file }}"
              {{- else }}
              cp "/ragflow/{{ .file }}" "/patched/{{ .file }}"
              sed -i '{{ .expr }}' "/patched/{{ .file }}"
              {{- end }}
              {{- if .verify }}
              grep -q '{{ .verify }}' "/patched/{{ .file }}" \
                || { echo "PATCH FAILED: {{ .file }} khong khop pattern"; exit 1; }
              {{- end }}
              python3 -m py_compile "/patched/{{ .file }}" \
                || { echo "PATCH FAILED: {{ .file }} sai cu phap Python"; exit 1; }
              echo "PATCH OK: {{ .file }}"
              {{- end }}
          volumeMounts:
            - name: code-patch-volume
              mountPath: /patched
            {{- if .Values.ragflow.codePatch.hasFullFiles }}
            - name: code-patch-src-volume
              mountPath: /code-patch-src
            {{- end }}
      {{- end }}
      containers:
      - name: ragflow
        image: {{ include "ragflow.imageRepo" (dict "root" . "repo" .Values.ragflow.image.repository) }}:{{ .Values.ragflow.image.tag }}
        {{- with .Values.ragflow.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        {{- if .Values.ragflow.admin.enabled }}
        args:
          - "--enable-adminserver"
        {{- end }}
        ports:
          - containerPort: 80
            name: http
          - containerPort: 9380
            name: http-api
          {{- if .Values.ragflow.admin.enabled }}
          - containerPort: 9381
            name: admin
          {{- end }}
        volumeMounts:
          - mountPath: /etc/nginx/conf.d/ragflow.conf.python
            subPath: ragflow.conf.python
            name: nginx-config-volume
          - mountPath: /etc/nginx/proxy.conf
            subPath: proxy.conf
            name: nginx-config-volume
          - mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            name: nginx-config-volume
          {{- with .Values.ragflow.service_conf }}
          - mountPath: /ragflow/conf/local.service_conf.yaml
            subPath: local.service_conf.yaml
            name: service-conf-volume
          {{- end }}
          {{- with .Values.ragflow.llm_factories }}
          - mountPath: /ragflow/conf/llm_factories.json
            subPath: llm_factories.json
            name: service-conf-volume
          {{- end }}
          {{- if .Values.ragflow.codePatch.enabled }}
          {{- range .Values.ragflow.codePatch.patches }}
          - mountPath: /ragflow/{{ .file }}
            subPath: {{ .file }}
            name: code-patch-volume
          {{- end }}
          {{- end }}
        envFrom:
          - secretRef:
              name: {{ include "ragflow.fullname" . }}-env-config
        # --- Probes (them 2026-08-21) -----------------------------------------
        # VAN DE TRUOC DO: KHONG co probe nao. K8s mac dinh coi container
        # "Ready" ngay khi process start => Service them pod vao Endpoints =>
        # nginx forward request vao pod CHUA ket noi duoc MySQL/ES/Redis/MinIO
        # => 502. Nang hon khi rolling update: pod cu bi giet ngay khi pod moi
        # bao "Ready" (that ra chua san sang) => co thoi diem KHONG pod nao phuc vu.
        #
        # Endpoint doc tu SOURCE v0.26.4 (khong doan):
        #   api/apps/restful_apis/system_api.py:229  @manager.route("/system/healthz")
        #   api/apps/restful_apis/system_api.py:38   @manager.route("/system/ping")
        #   api/apps/__init__.py:363  url_prefix = "/api/v1" cho restful_apis
        #   => duong dan day du: /api/v1/system/healthz va /api/v1/system/ping
        # Ca hai KHONG co @login_required => goi duoc khong can token.
        # (Nguoc lai /system/version CO ApiKeyAuth => KHONG dung lam probe duoc.)
        {{- with .Values.ragflow.deployment.readinessProbe }}
        readinessProbe:
          {{- . | toYaml | nindent 10 }}
        {{- end }}
        {{- with .Values.ragflow.deployment.livenessProbe }}
        livenessProbe:
          {{- . | toYaml | nindent 10 }}
        {{- end }}
        {{- with .Values.ragflow.deployment.startupProbe }}
        startupProbe:
          {{- . | toYaml | nindent 10 }}
        {{- end }}
        {{- with .Values.ragflow.deployment.resources }}
        resources:
          {{- . | toYaml | nindent 10 }}
        {{- end }}
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config
        - name: service-conf-volume
          configMap:
            name: ragflow-service-config
        {{- if .Values.ragflow.codePatch.enabled }}
        - name: code-patch-volume
          # sizeLimit: emptyDir mac dinh KHONG gioi han => ghi bao nhieu cung duoc
          # va tinh vao disk NODE. Dat tran de mot pod loi khong the lam day node.
          # Vuot tran => kubelet evict rieng pod do (thay vi ca node vao DiskPressure).
          emptyDir:
            sizeLimit: {{ .Values.ragflow.codePatch.sizeLimit | default "256Mi" }}
        {{- if .Values.ragflow.codePatch.hasFullFiles }}
        - name: code-patch-src-volume
          configMap:
            name: {{ include "ragflow.fullname" . }}-code-patch-src
        {{- end }}
        {{- end }}
{{- if .Values.ragflow.deployment.podDisruptionBudget.enabled }}
---
# PodDisruptionBudget (them 2026-08-21)
# VAN DE TRUOC DO: redis CO pdb (redis.yaml), ragflow thi KHONG.
# => `kubectl drain` mot node (bao tri, no disk, upgrade) co the xoa CA 3 pod
#    ragflow cung luc neu chung tinh co nam chung node => downtime toan bo.
# podAntiAffinity chi la "preferred" (mem) nen KHONG bao dam 3 pod o 3 node khac nhau.
#
# minAvailable: k8s se TU CHOI eviction neu so pod Ready tut xuong duoi muc nay.
# Voi replicas=3, minAvailable=2 cho phep drain lan luot tung node ma van con 2 pod phuc vu.
# LUU Y: PDB chi chan EVICTION CO CHU DICH (drain, descheduler).
# KHONG chan duoc kubelet evict do DiskPressure/MemoryPressure - do la eviction
# cuong buc o tang node. Chong loai do bang resources.requests (QoS Burstable).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ragflow.fullname" . }}-pdb
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  {{- if .Values.ragflow.deployment.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.ragflow.deployment.podDisruptionBudget.minAvailable }}
  {{- else if .Values.ragflow.deployment.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.ragflow.deployment.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ragflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ragflow
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ragflow.fullname" . }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  selector:
    {{- include "ragflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
  ports:
    - protocol: TCP
      port: {{ .Values.ragflow.service.port | default 80 }}
      targetPort: http
      name: http
      {{- if and (eq .Values.ragflow.service.type "NodePort") .Values.ragflow.service.nodePort }}
      nodePort: {{ .Values.ragflow.service.nodePort }}
      {{- end }}
  type: {{ .Values.ragflow.service.type }}
---
{{- if .Values.ragflow.api.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  selector:
    {{- include "ragflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
  ports:
    - protocol: TCP
      port: 80
      targetPort: http-api
      name: http-api
  type: {{ .Values.ragflow.api.service.type }}
{{- end }}

{{- if .Values.ragflow.admin.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  selector:
    {{- include "ragflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
  ports:
    - protocol: TCP
      port: {{ .Values.ragflow.admin.port }}
      targetPort: admin
      name: admin
  type: {{ .Values.ragflow.admin.serviceType }}
{{- end }}
